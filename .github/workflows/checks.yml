name: Publication checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  newsroom:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: newsroom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/newsroom_test
      DIRECT_URL: postgresql://postgres:test-only@localhost:5432/newsroom_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:integration
      - run: npm run sync:content -- --dry
      - run: npm audit --omit=dev
